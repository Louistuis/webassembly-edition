# The browser build (docs/web.md): getrandom 0.3 takes its randomness from the page's crypto.getRandomValues.
# The game's memory is capped at 2 GiB: past that an allocation fails in the game
# instead of the tab taking the whole machine's memory with it.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"', "-C", "link-arg=--max-memory=2147483648"]
